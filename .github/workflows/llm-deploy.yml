name: Deploy LLM Laptop

# infra/llm/scripts/stage-runtime.sh stages this commit into an immutable
# /opt/nextvisit/llm/releases/<sha> directory and flips
# /opt/nextvisit/llm/current atomically; infra/llm/systemd/nextvisit-llm.service
# recovers the exact three-file stack from that release after a reboot.
# /opt/nextvisit/llm is now nextvisit-runner-owned (bootstrap-ubuntu-host.sh),
# so this unprivileged job can flip `current` itself.
#
# This job is the trust boundary for the only self-hosted runner in this
# repository: infra/llm/tests/workflows-test.sh,
# infra/llm/tests/workflows-runner-group-test.sh, and
# infra/llm/tests/llm-deploy-mutation-test.sh together prove that no PR, fork,
# or unreviewed workflow edit can loosen the exact main-only gate, the
# group+labels runner selection, the pinned-SHA credential-less checkout, or
# the no-port/no-token assertions below. Re-running the same offline test
# suite here, on the exact commit this job just checked out, is deliberate
# defense in depth against a compromise between CI's check and this run.

on:
  push:
    branches: [main]
    paths:
      - "infra/llm/**"
      - ".github/workflows/llm-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-laptop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.LLM_DEPLOY_ENABLED == 'true' }}
    runs-on:
      group: llm-production
      labels: [self-hosted, linux, llm]
    environment: llm-laptop
    timeout-minutes: 90
    steps:
      - name: Check out triggering main commit without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Run offline infra test suite
        run: |
          for test in infra/llm/tests/*.sh; do
            sh "$test"
          done

      - name: Verify Ubuntu GPU host
        run: infra/llm/scripts/verify-host.sh gpu

      - name: Verify local Tunnel token file
        run: infra/llm/scripts/verify-tunnel-token-file.sh /etc/nextvisit/llm.token

      - name: Stage immutable release
        run: infra/llm/scripts/stage-runtime.sh "$GITHUB_SHA" "$GITHUB_WORKSPACE"

      - name: Build, initialize, and smoke Ollama on loopback
        working-directory: /opt/nextvisit/llm/current
        run: |
          docker compose --project-name nextvisit-llm -f compose.yml -f compose.gpu.yml build ollama
          docker compose --project-name nextvisit-llm -f compose.yml -f compose.gpu.yml up --detach --wait ollama
          docker compose --project-name nextvisit-llm -f compose.yml -f compose.gpu.yml run --rm model-init
          "$GITHUB_WORKSPACE/infra/llm/scripts/smoke-openai.sh" http://127.0.0.1:11434/v1

      - name: Apply final no-port Tunnel configuration
        working-directory: /opt/nextvisit/llm/current
        env:
          NEXTVISIT_LLM_TOKEN_FILE: /etc/nextvisit/llm.token
        run: |
          umask 077
          rendered="$(mktemp "$RUNNER_TEMP/llm-compose.XXXXXX")"
          trap 'rm -f "$rendered"' EXIT
          chmod 600 "$rendered"
          docker compose --project-name nextvisit-llm -f compose.yml -f compose.gpu.yml -f compose.tunnel.yml up --detach --wait ollama cloudflared
          docker compose --project-name nextvisit-llm -f compose.yml -f compose.gpu.yml -f compose.tunnel.yml config --format json >"$rendered"
          jq -e '.services.ollama.ports == null' "$rendered" >/dev/null
          ollama_id="$(docker compose --project-name nextvisit-llm -f compose.yml -f compose.gpu.yml -f compose.tunnel.yml ps -q ollama)"
          test -n "$ollama_id"
          test "$(docker inspect -f '{{len .HostConfig.PortBindings}}' "$ollama_id")" = 0
          test "$(docker compose --project-name nextvisit-llm -f compose.yml -f compose.gpu.yml -f compose.tunnel.yml ps --status running --services | grep -Ec '^(ollama|cloudflared)$')" = 2
          jq -e '.secrets.tunnel_token.file != null' "$rendered" >/dev/null
          jq -e '.secrets.tunnel_token.environment == null' "$rendered" >/dev/null
          jq -e '.services.cloudflared.environment == null' "$rendered" >/dev/null
          jq -e '.services.cloudflared.labels == null' "$rendered" >/dev/null
          jq -e '.services.cloudflared.command == ["tunnel","--no-autoupdate","run","--token-file","/run/secrets/tunnel_token"]' "$rendered" >/dev/null
          cloudflared_id="$(docker compose --project-name nextvisit-llm -f compose.yml -f compose.gpu.yml -f compose.tunnel.yml ps -q cloudflared)"
          test -n "$cloudflared_id"
          test "$(docker inspect -f '{{json .Config.Cmd}}' "$cloudflared_id")" = '["tunnel","--no-autoupdate","run","--token-file","/run/secrets/tunnel_token"]'

      - name: Verify recovery unit remains enabled and active
        run: |
          test "$(systemctl is-enabled nextvisit-llm.service)" = enabled
          test "$(systemctl is-active nextvisit-llm.service)" = active
