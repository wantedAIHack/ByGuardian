spring:
  application:
    name: nextvisit-api
  datasource:
    url: ${NEXTVISIT_DB_URL:jdbc:postgresql://localhost:5432/nextvisit}
    username: ${NEXTVISIT_DB_USER:nextvisit}
    password: ${NEXTVISIT_DB_PASSWORD:nextvisit}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    locations: classpath:db/migration/{vendor}
server:
  port: 8080
nextvisit:
  timezone: Asia/Seoul
  cors:
    allowed-origins: ${NEXTVISIT_CORS_ORIGINS:http://localhost:5173}
  demo:
    enabled: ${NEXTVISIT_DEMO_ENABLED:true}
  internal-seed:
    enabled: ${NEXTVISIT_INTERNAL_SEED_ENABLED:false}
  llm:
    enabled: ${NEXTVISIT_LLM_ENABLED:false}
    base-url: ${NEXTVISIT_LLM_BASE_URL:http://localhost:11434/v1}
    model: ${NEXTVISIT_LLM_MODEL:qwen3:4b-q4_K_M}
    api-key: ${NEXTVISIT_LLM_API_KEY:ollama}
    cf-access-client-id: ${NEXTVISIT_LLM_CF_ACCESS_CLIENT_ID:}
    cf-access-client-secret: ${NEXTVISIT_LLM_CF_ACCESS_CLIENT_SECRET:}
    connect-timeout: ${NEXTVISIT_LLM_CONNECT_TIMEOUT:3s}
    read-timeout: ${NEXTVISIT_LLM_READ_TIMEOUT:45s}
    max-attempts: ${NEXTVISIT_LLM_MAX_ATTEMPTS:3}
    max-output-tokens: ${NEXTVISIT_LLM_MAX_OUTPUT_TOKENS:3000}
    reasoning-effort: ${NEXTVISIT_LLM_REASONING_EFFORT:none}
    synthesis-max-note-chars: ${NEXTVISIT_LLM_SYNTHESIS_MAX_NOTE_CHARS:4000}
