services:
  postgres:
    image: postgres:16-alpine
    container_name: nextvisit-postgres
    environment:
      POSTGRES_DB: nextvisit
      POSTGRES_USER: nextvisit
      POSTGRES_PASSWORD: nextvisit
    ports:
      - "5432:5432"
    volumes:
      - nextvisit-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextvisit -d nextvisit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nextvisit-pg:
